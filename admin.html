<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="supabase-url" content="">
  <meta name="supabase-anon-key" content="">
  <title>FamiliePraxis — Admin</title>
  <style>
    /* ---------- Variables ---------- */
    :root {
      --primary: #2C5F5C;
      --primary-light: #8BA89A;
      --primary-pale: #E8F0EF;
      --bg: #FAF7F2;
      --text: #2D2A26;
      --text-light: #5A5A5A;
      --text-muted: #8A8A8A;
      --card-bg: #FFFFFF;
      --border: #E8E4DF;
      --danger: #C0392B;
      --danger-light: #FADBD8;
      --success: #27AE60;
      --success-light: #D5F5E3;
      --shadow: rgba(44, 95, 92, 0.08);
    }

    /* ---------- Reset ---------- */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
    }

    /* ---------- Login ---------- */
    .login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .login-box {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 40px 32px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 4px 24px var(--shadow);
    }
    .login-box h1 {
      color: var(--primary);
      font-size: 24px;
      margin-bottom: 4px;
    }
    .login-box p {
      color: var(--text-muted);
      margin-bottom: 24px;
      font-size: 14px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-light);
      margin-bottom: 6px;
    }
    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
      color: var(--text);
      background: var(--card-bg);
      transition: border-color 0.2s;
    }
    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-pale);
    }
    .form-group textarea {
      min-height: 100px;
      resize: vertical;
    }
    .login-error {
      color: var(--danger);
      font-size: 13px;
      margin-bottom: 12px;
      display: none;
    }

    /* ---------- Buttons ---------- */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }
    .btn-primary:hover { opacity: 0.9; }

    .btn-secondary {
      background: var(--primary-pale);
      color: var(--primary);
    }

    .btn-danger {
      background: var(--danger-light);
      color: var(--danger);
    }

    .btn-success {
      background: var(--success-light);
      color: var(--success);
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 13px;
    }

    .btn-full {
      width: 100%;
      justify-content: center;
    }

    /* ---------- Admin Layout ---------- */
    .admin-app {
      display: none;
      min-height: 100vh;
    }

    .admin-topbar {
      background: var(--primary);
      color: #fff;
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .admin-topbar h1 {
      font-size: 17px;
      font-weight: 700;
    }
    .admin-topbar .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
    }
    .admin-topbar .user-info span {
      opacity: 0.8;
    }
    .btn-logout {
      background: rgba(255,255,255,0.15);
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-logout:hover { background: rgba(255,255,255,0.25); }

    .hamburger-btn {
      display: none;
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
      padding: 4px;
    }

    .admin-body {
      display: flex;
      min-height: calc(100vh - 56px);
    }

    /* ---------- Sidebar ---------- */
    .admin-sidebar {
      width: 220px;
      background: var(--card-bg);
      border-right: 1px solid var(--border);
      padding: 16px 0;
      flex-shrink: 0;
    }
    .admin-sidebar .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 20px;
      font-size: 14px;
      color: var(--text-light);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      font-family: inherit;
    }
    .admin-sidebar .nav-item:hover {
      background: var(--primary-pale);
      color: var(--primary);
    }
    .admin-sidebar .nav-item.active {
      background: var(--primary-pale);
      color: var(--primary);
      font-weight: 600;
    }
    .admin-sidebar .nav-item .nav-icon {
      width: 18px;
      text-align: center;
      font-size: 16px;
    }

    /* ---------- Content Area ---------- */
    .admin-content {
      flex: 1;
      padding: 24px;
      max-width: 900px;
    }

    .section { display: none; }
    .section.active { display: block; }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .section-header h2 {
      font-size: 22px;
      color: var(--primary);
    }

    /* ---------- Table ---------- */
    .data-table {
      width: 100%;
      border-collapse: collapse;
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 1px 4px var(--shadow);
    }
    .data-table th,
    .data-table td {
      padding: 12px 16px;
      text-align: left;
      font-size: 14px;
      border-bottom: 1px solid var(--border);
    }
    .data-table th {
      background: var(--primary-pale);
      color: var(--primary);
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .data-table tr:last-child td { border-bottom: none; }
    .data-table tr:hover td { background: #FAFAFA; }

    .table-actions {
      display: flex;
      gap: 6px;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge-active {
      background: var(--success-light);
      color: var(--success);
    }
    .badge-inactive {
      background: var(--danger-light);
      color: var(--danger);
    }

    /* ---------- Form Card ---------- */
    .form-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 1px 4px var(--shadow);
      margin-bottom: 24px;
    }
    .form-card h3 {
      color: var(--primary);
      font-size: 18px;
      margin-bottom: 16px;
    }
    .form-row {
      display: flex;
      gap: 16px;
    }
    .form-row .form-group {
      flex: 1;
    }

    /* ---------- Dynamic Array ---------- */
    .array-container {
      margin-bottom: 16px;
    }
    .array-container label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-light);
      margin-bottom: 6px;
    }
    .array-item {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      margin-bottom: 8px;
    }
    .array-item input,
    .array-item textarea {
      flex: 1;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text);
    }
    .array-item input:focus,
    .array-item textarea:focus {
      outline: none;
      border-color: var(--primary);
    }
    .btn-remove-item {
      background: var(--danger-light);
      color: var(--danger);
      border: none;
      border-radius: 6px;
      width: 32px;
      height: 32px;
      font-size: 18px;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* ---------- Checkbox Group ---------- */
    .checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
    }
    .checkbox-group label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 400;
      cursor: pointer;
      padding: 4px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      transition: background 0.15s;
    }
    .checkbox-group label:has(input:checked) {
      background: var(--primary-pale);
      border-color: var(--primary-light);
    }
    .checkbox-group input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--primary);
    }

    /* ---------- Toggle ---------- */
    .toggle-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .toggle {
      position: relative;
      width: 44px;
      height: 24px;
      appearance: none;
      -webkit-appearance: none;
      background: var(--border);
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s;
      border: none;
    }
    .toggle:checked {
      background: var(--primary);
    }
    .toggle::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 18px;
      height: 18px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    .toggle:checked::after {
      transform: translateX(20px);
    }

    /* ---------- Morgen Check-in Svar ---------- */
    .svar-container {
      margin-top: 8px;
    }
    .svar-item {
      background: #FAFAF8;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .svar-item h4 {
      font-size: 13px;
      color: var(--primary);
      margin-bottom: 8px;
    }
    .svar-item .form-group {
      margin-bottom: 10px;
    }

    /* ---------- Loading / Messages ---------- */
    .loading {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
      font-size: 14px;
    }
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      z-index: 1000;
      transform: translateY(80px);
      opacity: 0;
      transition: transform 0.3s, opacity 0.3s;
    }
    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }
    .toast-success { background: var(--success); }
    .toast-error { background: var(--danger); }

    /* ---------- Subscribers ---------- */
    .export-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .subscriber-count {
      font-size: 14px;
      color: var(--text-muted);
    }

    /* ---------- Responsive ---------- */
    @media (max-width: 768px) {
      .admin-sidebar {
        position: fixed;
        top: 56px;
        left: -260px;
        width: 260px;
        height: calc(100vh - 56px);
        z-index: 90;
        transition: left 0.25s;
        box-shadow: 4px 0 16px var(--shadow);
      }
      .admin-sidebar.open {
        left: 0;
      }
      .sidebar-overlay {
        display: none;
        position: fixed;
        inset: 56px 0 0 0;
        background: rgba(0,0,0,0.3);
        z-index: 80;
      }
      .sidebar-overlay.show {
        display: block;
      }
      .hamburger-btn {
        display: block;
      }
      .admin-content {
        padding: 16px;
      }
      .form-row {
        flex-direction: column;
        gap: 0;
      }
      .data-table {
        font-size: 13px;
      }
      .data-table th,
      .data-table td {
        padding: 10px 12px;
      }
    }
  </style>
</head>
<body>

  <!-- Login -->
  <div id="login-screen" class="login-screen">
    <div class="login-box">
      <h1>FamiliePraxis</h1>
      <p>Admin-panel — log ind for at redigere indhold</p>
      <div id="login-error" class="login-error"></div>
      <form id="login-form">
        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" required placeholder="din@email.dk">
        </div>
        <div class="form-group">
          <label for="login-password">Adgangskode</label>
          <input type="password" id="login-password" required placeholder="Adgangskode">
        </div>
        <button type="submit" class="btn btn-primary btn-full" id="login-btn">Log ind</button>
      </form>
    </div>
  </div>

  <!-- Admin App -->
  <div id="admin-app" class="admin-app">

    <!-- Topbar -->
    <div class="admin-topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="hamburger-btn" id="hamburger-btn" aria-label="Menu">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <h1>FamiliePraxis Admin</h1>
      </div>
      <div class="user-info">
        <span id="user-email"></span>
        <button class="btn-logout" id="logout-btn">Log ud</button>
      </div>
    </div>

    <div class="admin-body">

      <!-- Sidebar -->
      <div class="sidebar-overlay" id="sidebar-overlay"></div>
      <nav class="admin-sidebar" id="admin-sidebar">
        <button class="nav-item active" data-section="exercises">
          <span class="nav-icon">&#9997;</span> Øvelser
        </button>
        <button class="nav-item" data-section="themes">
          <span class="nav-icon">&#128218;</span> Temaer
        </button>
        <button class="nav-item" data-section="circles">
          <span class="nav-icon">&#9711;</span> Cirkler
        </button>
        <button class="nav-item" data-section="ladder">
          <span class="nav-icon">&#128694;</span> Trappen
        </button>
        <button class="nav-item" data-section="checkins">
          <span class="nav-icon">&#9728;</span> Morgen Check-in
        </button>
        <button class="nav-item" data-section="subscribers">
          <span class="nav-icon">&#9993;</span> Email-tilmeldinger
        </button>
      </nav>

      <!-- Content -->
      <main class="admin-content">

        <!-- Øvelser -->
        <div id="section-exercises" class="section active">
          <div class="section-header">
            <h2>Øvelser</h2>
            <button class="btn btn-primary btn-sm" id="btn-new-exercise">+ Ny øvelse</button>
          </div>
          <div id="exercise-form-area"></div>
          <div id="exercise-list"><div class="loading">Indlæser...</div></div>
        </div>

        <!-- Temaer -->
        <div id="section-themes" class="section">
          <div class="section-header">
            <h2>Temaer</h2>
            <button class="btn btn-primary btn-sm" id="btn-new-theme">+ Nyt tema</button>
          </div>
          <div id="theme-form-area"></div>
          <div id="theme-list"><div class="loading">Indlæser...</div></div>
        </div>

        <!-- Cirkler -->
        <div id="section-circles" class="section">
          <div class="section-header">
            <h2>Cirkler</h2>
          </div>
          <div id="circle-form-area"></div>
          <div id="circle-list"><div class="loading">Indlæser...</div></div>
        </div>

        <!-- Trappen -->
        <div id="section-ladder" class="section">
          <div class="section-header">
            <h2>Trappen</h2>
          </div>
          <div id="ladder-list"><div class="loading">Indlæser...</div></div>
        </div>

        <!-- Morgen Check-in -->
        <div id="section-checkins" class="section">
          <div class="section-header">
            <h2>Morgen Check-in</h2>
            <button class="btn btn-primary btn-sm" id="btn-new-checkin">+ Ny check-in</button>
          </div>
          <div id="checkin-form-area"></div>
          <div id="checkin-list"><div class="loading">Indlæser...</div></div>
        </div>

        <!-- Email-tilmeldinger -->
        <div id="section-subscribers" class="section">
          <div class="section-header">
            <h2>Email-tilmeldinger</h2>
          </div>
          <div class="export-bar">
            <span class="subscriber-count" id="subscriber-count"></span>
            <button class="btn btn-secondary btn-sm" id="btn-export-csv">Eksporter CSV</button>
          </div>
          <div id="subscriber-list"><div class="loading">Indlæser...</div></div>
        </div>

      </main>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <script src="js/supabase.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
